version: '3.8'

services:
  # Next.js Application
  nextjs:
    build:
      context: .
      dockerfile: Dockerfile.next
    ports:
      - "3000:3000"
    environment:
      - AI_SERVICE_URL=http://ai:8001
      - DATABASE_URL=postgresql://user:password@postgres:5432/paguyuban
      - NEXTAUTH_SECRET=your-secret-key
      - NEXTAUTH_URL=http://localhost:3000
    depends_on:
      - ai
      - postgres
    volumes:
      - .:/app
      - /app/node_modules
    networks:
      - paguyuban-network

  # Python AI Service
  ai:
    build:
      context: ./ai
      dockerfile: Dockerfile
    ports:
      - "8001:8001"
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - QDRANT_URL=http://qdrant:6333
    depends_on:
      - ollama
      - qdrant
    volumes:
      - ./ai:/app
      - ai_logs:/app/logs
    networks:
      - paguyuban-network

  # Ollama LLM Service
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - paguyuban-network
    command: serve

  # Qdrant Vector Database
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - paguyuban-network

  # PostgreSQL Database
  postgres:
    image: postgres:15
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=paguyuban
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - paguyuban-network

volumes:
  ollama_data:
  qdrant_data:
  postgres_data:
  ai_logs:

networks:
  paguyuban-network:
    driver: bridge
